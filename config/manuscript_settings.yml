# SCORCH study settings: the values used for the published analysis.
#
# SCORCH always starts from these values (they are also recorded in
# src/scorch/config.py; a test keeps the two copies identical). To run a
# different study, copy this file, change what you need and pass it with
#   scorch run --settings my_settings.yml --input-dir ... --output-dir ...
# Only the keys you include need to be present; everything else keeps the
# manuscript value. Unknown keys are reported as errors.

# Folders. Relative paths are resolved against base_dir (null = the repository
# folder, or the current folder when SCORCH is installed without a checkout).
paths:
  base_dir: null
  input_dir: input                       # holds the processed temperature file
  input_file: tmax_processed.nc
  supporting_input_dir: supporting_files/additional_inputs   # maps/grid_cells.csv, country boundaries
  supporting_results_dir: supporting_files/additional_results
  output_dir: output                     # catalogs/, tables/, figures/
  run_records_dir: null                  # null = .scorch/logs/run-records under base_dir

# The study grid and period. The input file supplies the grid; the counts are
# checked against it. expected_dates and expected_cells may be null.
study_area:
  lat_min: 10.0
  lat_max: 46.0
  lon_min: 20.0
  lon_max: 70.0
  grid_step_deg: 1.0
  warm_season_months: [4, 5, 6, 7, 8, 9]  # April to September
  first_year: 1940
  last_year: 2025
  expected_dates: 15738
  expected_cells: 1800

# Stage 1. A cell exceeds when Tmax >= its own percentile threshold (equality
# counts). A local heatwave needs min_exceeding_days exceeding days within a
# run of at least min_duration_days days; single non-exceeding days inside the
# run are bridged, two consecutive non-exceeding days end it.
local_heatwaves:
  threshold_quantile: 0.95
  min_duration_days: 3
  min_exceeding_days: 3

# Stage 2. The regional threshold is this quantile of the daily heatwave-cell
# count over all study days (days with zero cells included). The "higher"
# method takes the next observed count at or above the quantile position.
regional_days:
  quantile: 0.975
  quantile_method: higher

# Stage 3. Every (eps, min_samples) pair is tried on every selected day; eps is
# in grid-cell units. The most frequent non-zero cluster count decides which
# pairs are kept (see docs/usage.md for the full rule).
clustering:
  eps_values: [1.0, 1.5, 2.0, 2.5, 3.0, 3.5, 4.0]
  min_samples_values: [4, 5, 6, 7, 8, 9, 10, 11, 12]

# Stage 4. Ellipse semi-axes are scale_factor * sqrt(max(eigenvalue, floor)).
# The published centroid weights were single-precision temperatures; float64
# uses the input precision instead.
ellipses:
  scale_factor: 1.25
  eigenvalue_floor_km2: 1.0
  weighted_centroid_tmax_precision: float32

# Stage 5 summaries. The in-text statistics of Section 4 describe the Eastern
# Mediterranean and Middle East and need the Natural Earth country boundaries
# (relative to supporting_input_dir); switch them off for other regions.
summaries:
  in_text_statistics: true
  country_boundaries: maps/countries_10m/ne_10m_admin_0_countries.shp

# Events drawn in the manuscript figures (used only by the figure scripts).
representative_events:
  figure_5_type_1: ['2002-07-31']
  figure_5_type_2: ['1983-07-13']
  figure_6a_type_3: ['2017-07-17', '2017-07-18']
  figure_6b_type_3: ['1991-06-04', '1991-06-05']
  figure_7_type_4: ['2001-08-07', '2001-08-08', '2001-08-09', '2001-08-10', '2001-08-11', '2001-08-12']
  figure_s1_type_3: ['2016-06-07', '2016-06-08']

# Power-law fits (R). Clauset's method over all unique cutoffs but the largest,
# the smaller cutoff on ties, the MLE exponent and the full two-sided KS
# distance; the significance level is informational.
power_law:
  ks_mode: full
  n_bootstrap: 5000
  seed_daily_maxima: 20261020
  seed_event_maxima: 20261120
  significance_level: 0.1

# Log-Gaussian Cox process (R). The projection string is informational: the
# preparation script derives the Lambert azimuthal equal-area projection from
# the grid.
lgcp:
  projection: '+proj=laea +lat_0=28 +lon_0=45 +x_0=0 +y_0=0 +ellps=WGS84 +units=m +no_defs'
  raster_resolution_km: 25
  trend_terms: [lon, lat, mean_tmax, std_tmax]
  seed: 20260704

# Appendix B: scale factors tested on the two ellipse axes independently.
appendix_b:
  scale_factors: [0.5, 0.75, 1.0, 1.25, 1.5, 1.75, 2.0, 2.25, 2.5]

# Appendix C: random five-fold validation of the LGCP.
appendix_c:
  n_folds: 5
  fold_seed: 20260704
  zone_area_fractions: [0.1, 0.2, 0.3, 0.5]

# Supporting Information: the six power-law fitting configurations.
supplementary_power_law:
  n_bootstrap: 5000
  base_seed: 20260918
