name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the verified package versions
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/core.txt -r requirements/figures.txt -r requirements/dev.txt
          python -m pip install -e .
      - name: Show versions
        run: scorch info
      - name: Unit tests and demo end to end
        run: python -m pytest -q
      - name: Run the demo from the command line
        run: scorch demo --dir demo/run
      - name: Keep the demo figure
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: demo-overview
          path: demo/run/output/figures/demo_overview.png

  python-latest:
    name: Python 3.13 with current package versions (informative)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all]"
      - run: python -m pytest -q

  r:
    name: R model scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.1"
          use-public-rspm: true
      - name: Install the R packages
        run: Rscript environment/install_r_packages.R
      - name: Test the R functions
        run: Rscript --vanilla tests/r/test_r_functions.R
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the demo with the R power-law step
        run: |
          python -m pip install -r requirements/core.txt
          python -m pip install -e .
          scorch demo --dir demo/run --no-figure --with-r
          test -f demo/run/output/supporting_results/power_law_demo.csv
